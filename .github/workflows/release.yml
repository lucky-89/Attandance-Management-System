name: Build APK

# Every push: run the tests and build the APK (download it from the run's Artifacts).
# Publishing a release with a tag like v1.0.0: also attach the APK to that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the runner's Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew   # a web upload drops the executable bit

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name the APK
        run: |
          V="${APP_VERSION:-${GITHUB_SHA::7}}"
          cp app/build/outputs/apk/release/app-release.apk "FinowiseHR-$V.apk"
          echo "APK=FinowiseHR-$V.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            **Install on Android 8.0+:** download `${{ env.APK }}` below on your phone, open it, and allow
            "Install unknown apps" when asked. All data stays on the device.
